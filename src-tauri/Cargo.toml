[package]
name = "termy-code"
version = "0.1.0"
description = "Termy Code: a desktop client for ACP coding agents"
authors = ["Lasse Vestergaard"]
edition = "2021"

[lib]
name = "termy_code_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ignore = "0.4"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt-multi-thread", "time"] }
rusqlite = { version = "0.40", features = ["bundled"] }
# Raw PTY API lives on the `termy-code/raw-pty` branch of termy (worktree at ../termy-raw-pty).
termy_core = { path = "../../termy-raw-pty/crates/core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
